# Piazza Pulita — configurazione Apache (hardening + URL puliti).
#
# Installata da deploy/00-bootstrap.sh in /etc/apache2/conf-available/piazzapulita.conf
# e abilitata con a2enconf. Non tocca i vhost esistenti.
#
# NB: DocumentRoot e' /var/www/html (symlink a /data/html). Apache usa il
# percorso col symlink NON risolto per <Directory>.

<Directory /var/www/html/piazzapulita>
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /piazzapulita/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

# Nega l'accesso web alle directory non pubbliche (qualsiasi prefisso di percorso).
<DirectoryMatch "/piazzapulita/(src|db|bin|config|deploy|storage|views|tests|docs|fonti)(/|$)">
    Require all denied
</DirectoryMatch>

# Nega file sensibili sparsi.
<FilesMatch "(^\.|\.(md|sql|lock|log|dist|example|ini)$|composer\.(json|lock))">
    Require all denied
</FilesMatch>
